<div id="sutta">
            <h1 id="thag1.39">Thag 1:39  Tissa</h1>
            <div class="verse">
              <p>As if struck by a sword,</p>
              <p>as if his head were on fire,</p>
              <p>a monk should live the wandering life</p>
              <p class="v2">—mindful—</p>
              <p>for the abandoning of sensual passion.</p>
            </div><!--end verse-->
      </div>
