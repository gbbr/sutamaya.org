<div id="sutta">
            <h1 id="thag1.93">Thag 1:93  Eraka</h1>
            <div class="verse">
              <p>Sensual pleasures are stressful,</p>
              <p class="v6">Eraka.</p>
              <p>Sensual pleasures aren’t ease.</p>
              <p>Whoever loves sensual pleasures</p>
              <p class="v2">loves stress,     Eraka.</p>
              <p>Whoever doesn’t,</p>
              <p class="v2">doesn’t love stress.</p>
            </div><!--end verse-->
      </div>
