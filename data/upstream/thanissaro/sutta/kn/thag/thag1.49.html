    <h1 id="thag1.49">Thag 1:49  Rāmaṇeyyaka</h1>
            <div class="verse">
              <p>Even with all the whistles &amp; whistling,</p>
              <p>the calls of the birds,</p>
              <p>this, my mind, doesn’t waver,</p>
              <p>for my delight is in</p>
              <p>oneness.</p>
            </div><!--end verse-->
      </div>
