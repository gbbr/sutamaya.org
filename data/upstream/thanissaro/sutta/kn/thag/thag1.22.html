<div id="sutta">
            <h1 id="thag1.22">Thag 1:22  Cittaka</h1>
            <div class="verse">
              <p class="v2">Peacocks,</p>
              <p>crested, blue, with gorgeous necks,</p>
              <p class="v2">cry out</p>
              <p>in the Kāraṁvī woods,</p>
              <p>thrilled by the cold wind.</p>
              <p>They awaken the sleeper</p>
              <p class="v2">to meditate.</p>
            </div><!--end verse-->
      </div>
