    <h1 id="thag1.25">Thag 1:25  Nandiya (to Māra)</h1>
            <div class="verse">
              <p>Like splendor, his mind,</p>
              <p>continually fruitful:</p>
              <p>Attack a monk like that,</p>
              <p class="v1">you Dark One,</p>
              <p class="v3">and you’ll fall</p>
              <p class="v3">into pain.</p>
            </div><!--end verse-->
            <p class="seealso"> See also: SN 5; <a href="/suttas/KN/Ud/ud4_4.html">Ud 4:4</a>; <a href="/suttas/KN/StNp/StNp3_2.html">Sn 3:2</a></p><!--end seealso-->
