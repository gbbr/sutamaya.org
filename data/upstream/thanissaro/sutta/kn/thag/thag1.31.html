<div id="sutta">
            <h1 id="thag1.31">Thag 1:31  Gahuratīriya</h1>
            <div class="verse">
              <p>Touched by gnats &amp; mosquitoes,</p>
              <p>in the wilds, the great forest,</p>
              <p>like a nāga elephant</p>
              <p>at the head of a battle,</p>
              <p class="v2">mindful,</p>
              <p>he acquiesces to that.</p>
            </div><!--end verse-->
      </div>
