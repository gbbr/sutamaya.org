<div id="sutta">
            <h1 id="thag1.110">Thag 1:110  Usabha</h1>
            <div class="verse">
              <p>Trees on the hilltops</p>
              <p>are flourishing,</p>
              <p>watered by a new high-rising cloud,</p>
              <p>giving birth to even more goodness</p>
              <p>for Usabha—</p>
              <p class="v2">desiring seclusion,</p>
              <p class="v2">conscious of</p>
              <p class="v2">“wilderness.”</p>
            </div><!--end verse-->
            <p class="seealso">See also: <a href="/suttas/MN/MN121.html">MN 121</a></p><!--end seealso-->
