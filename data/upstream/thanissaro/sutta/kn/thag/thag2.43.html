            <h1 id="thag2.43">Thag 2:43  Brahmāli</h1>

<div class="verse">
<pre>Whose faculties have been made tranquil,
like horses well-tamed by a charioteer —
effluents abandoned,
envied even by devas,
	Such?
</pre>
<pre>My faculties have been made tranquil
like horses well-tamed by a charioteer —
effluents abandoned,
I’m envied even by devas.
	Such.
</pre>
