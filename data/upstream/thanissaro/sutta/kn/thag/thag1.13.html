<div id="sutta">
            <h1 id="thag1.13">Thag 1:13  Vanavaccha</h1>
            <div class="verse">
              <p>The color of blue-dark clouds,</p>
              <p class="v2">glistening,</p>
              <p>cooled with the waters</p>
              <p>of clear-flowing streams</p>
              <p>covered with ladybugs:</p>
              <p class="v2">Those rocky crags</p>
              <p class="v2">refresh me.</p>
            </div><!--end verse-->
      </div>
