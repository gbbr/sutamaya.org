    <h1 id="thag1.18">Thag 1:18  Siṅgālapitar</h1>
            <div class="verse">
              <p>There was an heir to the One Awakened,</p>
              <p>a monk in the Bhesakaḷā forest,</p>
              <p>who suffused this whole earth</p>
              <p>with the perception of</p>
              <p class="v1">“bones.”</p>
              <p>Quickly, I’d say, he abandoned</p>
              <p class="v2">sensual passion.</p>
            </div><!--end verse-->
      </div>
