<div id="sutta">
    <h1 id="thag1.95">Thag 1:95  Cakkhupāla</h1>
            <div class="verse">
              <p>I’m blind,</p>
              <p>my eyes are destroyed.</p>
              <p>I’ve stumbled</p>
              <p>on a wilderness track.</p>
              <p class="v2">Even</p>
              <p>if I must crawl,</p>
              <p class="v2">I’ll go on,</p>
              <p>but not with an evil companion.</p>
            </div><!--end verse-->
      </div>
