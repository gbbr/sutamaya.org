            <h1 id="thag2.19">Thag 2:19  Nanda</h1>

<div class="verse">
<pre>From inappropriate attention
I was devoted to ornament,
	restless &amp; vain,
driven by sensual passion.
</pre>
<pre>With the help of the Buddha,
the Kinsman of the Sun,
skilled in strategies,
I, practicing appropriately,
	plucked my mind
out of becoming.
</pre>
</div><!--end verse-->
