<div id="sutta">
            <h1 id="thag1.32">Thag 1:32  Suppiya</h1>
            <div class="verse">
              <p>I’ll make a trade:</p>
              <p>aging for the ageless,</p>
              <p>burning for the unbound—</p>
              <p class="v2">the highest peace,</p>
              <p class="v2">the unexcelled rest</p>
              <p class="v4">from the yoke.</p>
            </div><!--end verse-->
      </div>
