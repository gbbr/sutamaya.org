            <h1 id="thag2.42">Thag 2:42  Dhammapāla</h1>

<div class="verse">
<pre>The young monk
devoted to the Buddha’s message,
is wakeful among those who sleep.
	His life is not in vain.
</pre>
<pre>So, intelligent,
one should commit oneself
to conviction &amp; virtue,
confidence &amp; Dhamma-vision,
	remembering the Buddhas’ message.
</pre>
</div><!--end verse-->
