<div id="sutta">
            <h1 id="thag1.50">Thag 1:50  Vimala</h1>
            <div class="verse">
              <p>The earth’s sprinkled</p>
              <p>with rain, wind</p>
              <p>is blowing, lightning</p>
              <p>wanders the sky,</p>
              <p>but my thoughts are stilled,</p>
              <p class="v2">well-centered</p>
              <p class="v2">my mind.</p>
            </div><!--end verse-->
      </div>
