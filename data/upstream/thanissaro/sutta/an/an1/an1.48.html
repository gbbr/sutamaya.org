                <h1 id="AN1.49">Quick to Reverse Itself<br>
                  Lahu-parivaṭṭa Sutta  (AN 1:49)</h1><!--end suttahead-->
                <p>“I don’t envision a single thing that is as quick to reverse itself as the mind—so much so that there is no satisfactory simile for how quick to reverse itself it is.”</p>
