                <h1 id="AN1.48">Soft<br>
                  Mudu Sutta  (AN 1:48)</h1><!--end suttahead-->
                <p>“Just as, of all trees, the balsam is foremost in terms of softness and pliancy, in the same way I don’t envision a single thing that, when developed &amp; cultivated, is as soft &amp; pliant as the mind. The mind, when developed &amp; cultivated, is soft &amp; pliant.”</p>
