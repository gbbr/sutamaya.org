                <h1 id="AN2.74">Pleasures<br>
                  Sukha Sutta  (AN 2:74)</h1>
<p>“Monks, there are these two pleasures. Which two? Pleasure with enjoyment as its object &amp; pleasure with equanimity as its object. There are these two pleasures. And the foremost of these two pleasures is pleasure with equanimity as its object.”</p>
