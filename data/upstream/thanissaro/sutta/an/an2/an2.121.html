                <h1 id="AN2.120">Rarely Having Enough<br>
                  Duttappaya Sutta  (AN 2:120)</h1>
<p>“Monks, these two persons rarely have enough. Which two? One who piles [hoards] gain &amp; gain, and one who spends [squanders] gain &amp; gain. These two persons rarely have enough.”</p>
