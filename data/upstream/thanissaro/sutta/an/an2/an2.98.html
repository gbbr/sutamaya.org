                <h1 id="AN2.99">Fools<br>
                  Bāla Sutta  (AN 2:99)</h1><!--end suttahead-->
                <p>“Monks, these two are fools. Which two? The one who takes up a burden that hasn’t fallen to him, and the one who doesn’t take up a burden that has. These two are fools.”</p>
