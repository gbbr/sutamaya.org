<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF9F5" />
    <!-- The starting values for the tab title and the description a search result shows. Each page
         rewrites both for its own subject once React mounts (hooks/useDocumentMeta.ts) — Google
         renders the app before indexing it, so what that hook writes is what reaches the result
         page. These stay as the fallback for a page with nothing of its own to say, and must match
         DEFAULT_TITLE / DEFAULT_DESCRIPTION in lib/documentMeta.ts. -->
    <meta
      name="description"
      content="An offline reader for the Pali suttas: browse the whole canon, keep lists, highlight passages, take notes, and tap any word for a dictionary."
    />
    <!-- The `-vN` suffix is the only thing that gets a new tab icon onto a device that already
         has one: the service worker precaches this path and the runtime rules cache it for a
         year, so overwriting the file in place changes nothing until that lapses. Changing the
         artwork means bumping the suffix and renaming the file, here and in vite.config.ts's
         `includeAssets`. -->
    <link rel="icon" href="/favicon-v2.svg" type="image/svg+xml" />
    <!-- Cloudflare Web Analytics — aggregate visit/pageview counts only (cookie-less, no
         personal data). Manually registered against the sutamaya.org site tag in the Cloudflare
         dashboard, not tied to any DNS/proxy change. Sees SPA route changes automatically (it
         hooks History API pushState/popstate), so it reports real in-app navigation, not just
         the entry URL. Only fires while online — offline PWA sessions aren't counted. -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "9ccb5acc36b045d1a2ae008a1c61e694"}'></script>
    <!--
      iPadOS Safari's "Add to Home Screen" only offers a full standalone web app (rather than a
      plain bookmark) when these Apple-specific tags are present — the web manifest alone isn't
      enough on iPadOS the way it is on iOS. apple-touch-icon in particular is what iPadOS uses
      to decide the share sheet should show the "add to home screen as app" option at all.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default" (opaque, content doesn't extend under it) rather than "black-translucent" —
         the latter would put the physical status bar over the app's own content, which would
         need safe-area-inset-top padding threaded through the reader/library headers to
         compensate; nothing in this app currently does that. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="sutamaya" />
    <!-- Its own file rather than the manifest's icon-192: iOS renders this artwork at 180px on
         the home screen and applies its own rounded-corner mask, while the manifest icons are
         sized and padded for Android's circular adaptive-icon crop. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Newsreader/IBM Plex Sans are self-hosted (see index.css's @font-face rules) rather than
         loaded from Google Fonts' CDN — no cross-origin round trip on first paint, and the fonts
         are covered by the same Service Worker precache as everything else. Preloading the
         default reading face's latin subset (the one Newsreader-normal file almost every load
         actually needs) shaves the "text is in Georgia, then swaps to Newsreader" flash down to
         whatever's left after preload, same-origin, instead of a full cross-origin+CSS+font
         round trip. -->
    <link rel="preload" href="/fonts/newsreader-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>sutamaya</title>
    <!--
      A blank #root is otherwise what paints first, for however long the JS bundle takes to
      download/parse/execute on a cold, mobile-network PWA launch — index.css's own
      `:root.dark` overrides can't apply until main.tsx's `applyTheme()` runs, so the static
      markup below (mirroring App.tsx's <Splash>) would flash light-then-dark instead of
      showing correctly themed from the very first paint. This tiny inline, non-deferred script
      runs before body parsing continues — before any paint — and applies the same 'dark' class
      main.tsx's own applyTheme(loadUiPrefs().theme) would, just early enough to matter; that
      later call is a harmless no-op repeat of the same class once React actually takes over.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('sutamaya.uiPrefs');
          var theme = (raw && JSON.parse(raw).theme) || 'light';
          var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            // Mirrors lib/themeColor.ts's dark shell color — avoids the title bar/status bar
            // flashing light-then-dark for the same reason the 'dark' class itself is set early.
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#171513');
          }
        } catch (e) {
          // storage unavailable/corrupt — falls through to the light-theme default, same as
          // loadUiPrefs() itself does
        }
      })();
    </script>
  </head>
  <body>
    <!-- Replaced wholesale the moment React mounts (main.tsx's createRoot(...).render call) —
         kept visually identical to App.tsx's own <Splash> (same classes/text) so that swap is
         seamless rather than a second, different-looking flash of its own. -->
    <div id="root">
      <div class="flex items-center justify-center h-full bg-paper">
        <div class="font-serif text-[20px] text-ink-2">sutamaya</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
