<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FDFCFA" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      iPadOS Safari's "Add to Home Screen" only offers a full standalone web app (rather than a
      plain bookmark) when these Apple-specific tags are present — the web manifest alone isn't
      enough on iPadOS the way it is on iOS. apple-touch-icon in particular is what iPadOS uses
      to decide the share sheet should show the "add to home screen as app" option at all.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default" (opaque, content doesn't extend under it) rather than "black-translucent" —
         the latter would put the physical status bar over the app's own content, which would
         need safe-area-inset-top padding threaded through the reader/library headers to
         compensate; nothing in this app currently does that. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sutamaya" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- Newsreader/IBM Plex Sans are self-hosted (see index.css's @font-face rules) rather than
         loaded from Google Fonts' CDN — no cross-origin round trip on first paint, and the fonts
         are covered by the same Service Worker precache as everything else. Preloading the
         default reading face's latin subset (the one Newsreader-normal file almost every load
         actually needs) shaves the "text is in Georgia, then swaps to Newsreader" flash down to
         whatever's left after preload, same-origin, instead of a full cross-origin+CSS+font
         round trip. -->
    <link rel="preload" href="/fonts/newsreader-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Sutamaya</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
